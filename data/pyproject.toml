[project]
name = "growth-agents-data"
version = "1.0.0"
description = "Local data service for the Growth Agents hackathon"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "reportlab>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pypdfium2>=4,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
growth-data = "growth_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["growth_data"]
